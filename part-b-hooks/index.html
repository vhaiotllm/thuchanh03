<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ chi tiêu - Hooks</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f4f4f4; }
    .page { max-width: 850px; margin: 25px auto; padding: 20px; background: white; color: #222; }
    .dark { background: #252525; color: white; }
    .dark input, .dark select { background: #444; color: white; border: 1px solid #777; }
    header { display: flex; align-items: center; justify-content: space-between; }
    form { display: flex; flex-wrap: wrap; gap: 8px; }
    input, select, button { padding: 8px; font-size: 14px; }
    button { cursor: pointer; }
    .loi { color: red; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #bbb; padding: 9px; text-align: left; }
    .filters { margin: 15px 0; }
    .filters button { margin-right: 5px; }
    .active { background: #3273dc; color: white; }
    .sum { font-weight: bold; margin-top: 15px; }
    .stats { margin: 15px 0; }
    .stats span { display: inline-block; padding: 6px; margin: 3px; border: 1px solid #aaa; }
  </style>
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
